# Sample orgtd config file.
#
# Copy this to $XDG_CONFIG_HOME/orgtd/config.toml (or ~/.config/orgtd/config.toml
# if $XDG_CONFIG_HOME is unset), then uncomment and edit whatever you need.
# Every key is optional and independent — orgtd runs fine with none of them
# set, or with only some of them uncommented.
#
# Each key also has a command-line flag of the same purpose; an explicit
# flag always overrides the value here. See `orgtd -h`, or the README, for
# the full precedence rules (org_dir specifically can also be set via
# $ORGTD_DIR, which beats this file but loses to an explicit -dir flag).

# Directory containing your .org files (loaded non-recursively). "~" is
# expanded to your home directory. Default: $ORGTD_DIR, then ~/org.
# org_dir = "~/org"

# External editor for `i` (edit entry/file). Anything your shell would
# accept after $EDITOR works, including extra arguments (e.g. "code --wait"),
# a double- or single-quoted argument containing spaces, and "~" in any word
# (expanded to your home directory, same as on the command line — unlike a
# real shell, nothing else expands it for a config file value). Default:
# $EDITOR, then vim.
# editor = "emacsclient -t"

# External program invoked as `<prog> <url>` to convert a bare URL, found
# while editing an entry, into an org-mode link — its stdout replaces the
# URL. May include extra arguments and "~" the same way editor can, e.g.
# "~/bin/myformatter --template \"a template\"". Leave unset to disable
# this (the default).
# url_formatter = "url2org"

# Extra bare-URL prefixes recognized beyond http:// and https://, e.g. for
# shortlinks with no scheme. Each is only matched at a word boundary, so
# "go/" won't also match inside "embargo/foo". Has no effect unless
# url_formatter is also set. Default: none.
# url_formatter_prefixes = ["bit.ly/", "go/"]

# External program :format-links invokes in batch mode: called with no
# url argument, it should read URLs one per line from stdin and print
# the same number of formatted lines to stdout. May include extra
# arguments and "~" the same way url_formatter can. Configured
# separately from url_formatter since a batch-capable command may differ
# from (or take different arguments than) whatever handles a single URL
# while editing. Leave unset to have :format-links use url_formatter
# too (the default).
# format_links_url_formatter = "url2org --batch"

# How many days ahead of today the agenda view's "Upcoming" section
# covers. Default: 14.
# agenda_window_days = 14

# Base name of the file :clarify treats as the inbox. Default: inbox.org.
# inbox_file = "inbox.org"

# How many hours after a DONE/CANCELLED item's CLOSED timestamp it's
# hidden from the outline view. Hidden items (and their subtrees) can
# still be shown again at any time with :toggledone. Default: 24.
# hide_done_after_hours = 24

# Log debug info (every URL formatter attempt/failure, etc.) to a
# debug.log file next to this config file. Off by default.
# debug = true

# Settings below this point are read only by gcalsync (see the README's
# "gcalsync" section), the separate program that syncs Google Calendar
# into an org file — not by orgtd itself. Both tools share this same
# config file (and org_dir, above) so they agree on where your org
# directory is without repeating it.
[gcalsync]

# OAuth2 client credentials for an installed-app ("Desktop app") client
# you create yourself in Google Cloud Console, with the Google Calendar
# API enabled. Required — every gcalsync user needs their own client,
# since a shared one baked into the binary couldn't keep its secret
# secret. No default.
# oauth_client_id = "...apps.googleusercontent.com"
# oauth_client_secret = "..."

# Google Calendar IDs to sync, e.g. "primary" for your own calendar, or
# an email address for a secondary/shared calendar. Default: ["primary"].
# calendar_ids = ["primary"]

# How many days into the past/future the sync window extends around now.
# Defaults: 1 / 14.
# sync_past_days = 1
# sync_future_days = 14

# Org file gcalsync fully regenerates on every run, resolved relative to
# org_dir unless absolute. It's a cache, not something to hand-edit — the
# generated file says so at the top. Default: calendar.org.
# output_file = "calendar.org"
